services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: six
      POSTGRES_PASSWORD: six
      POSTGRES_DB: six
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U six"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  install:
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /repo
    command:
      - sh
      - -c
      - |
        hash=$$(sha1sum package-lock.json | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" = "$$hash" ]; then echo "dependencies up to date"; exit 0; fi
        npm ci --no-audit --no-fund && echo "$$hash" > node_modules/.lock-hash
    volumes: &app-volumes
      - .:/repo
      - node_modules:/repo/node_modules
      - api_node_modules:/repo/apps/api/node_modules
      - web_next:/repo/apps/web/.next

  api:
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /repo/apps/api
    restart: unless-stopped
    command: sh -c "npx --no prisma migrate deploy && npx --no prisma generate && npx --no tsx watch src/server.ts"
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://six:six@postgres:5432/six
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:8333
    ports: ["4000:4000"]
    volumes: *app-volumes
    depends_on:
      install: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      storage: { condition: service_started }

  worker:
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /repo/apps/api
    restart: unless-stopped
    command: sh -c "npx --no prisma generate && npx --no tsx watch src/worker.ts"
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://six:six@postgres:5432/six
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:8333
    volumes: *app-volumes
    depends_on:
      install: { condition: service_completed_successfully }
      api: { condition: service_started }
      storage: { condition: service_started }

  web:
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /repo/apps/web
    restart: unless-stopped
    command: npx next dev --webpack --port 3000 --hostname 0.0.0.0
    environment:
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes: *app-volumes
    depends_on:
      install: { condition: service_completed_successfully }
      api: { condition: service_started }

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >
      server -dir=/data -ip=storage -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:3000
    ports: ["8333:8333"]
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  seaweeddata:
  node_modules:
  api_node_modules:
  web_next:
