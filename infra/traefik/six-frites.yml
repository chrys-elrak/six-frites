http:
  routers:
    six-frites-http:
      rule: "Host(`six-frites.koera.mg`)"
      entryPoints: [web]
      middlewares: [six-frites-to-https]
      service: six-frites-web

    six-frites-api:
      rule: "Host(`six-frites.koera.mg`) && (PathPrefix(`/v1`) || PathPrefix(`/socket.io`) || PathPrefix(`/docs`) || Path(`/health`))"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [six-frites-retry]
      service: six-frites-api
      priority: 30

    six-frites-media:
      rule: "Host(`six-frites.koera.mg`) && PathPrefix(`/six-media`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: six-frites-storage
      priority: 20

    six-frites-web:
      rule: "Host(`six-frites.koera.mg`)"
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [six-frites-headers, six-frites-retry]
      service: six-frites-web
      priority: 10

  middlewares:
    six-frites-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    six-frites-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

    # A deploy replaces one of each pair at a time; a request that reaches one as it stops goes to the other.
    six-frites-retry:
      retry:
        attempts: 3
        initialInterval: 100ms

  services:
    six-frites-api:
      loadBalancer:
        servers:
          - url: "http://six-frites-api:4000"
          - url: "http://six-frites-api-2:4000"
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
    six-frites-web:
      loadBalancer:
        servers:
          - url: "http://six-frites-web:3000"
          - url: "http://six-frites-web-2:3000"
        healthCheck:
          path: /version
          interval: 2s
          timeout: 1s
        sticky:
          cookie:
            name: six_web
            secure: true
            httpOnly: true
    six-frites-storage:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://six-frites-storage:8333"
